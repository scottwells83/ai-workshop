name: Build Linux installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-linux-installer.yml'
      - 'installer/linux/**'
      - 'Install AI Workshop.sh'
      - 'workshop.sh'
      - 'create-agents.sh'
      - 'workshop.py'
      - 'workshop_app.py'
      - 'desktop_setup.py'
      - 'desktop/**'
      - 'tests/**'
      - 'Open AI Workshop.sh'
      - 'ui/**'
      - 'Modelfile*'
      - 'agents/**'
      - 'guides/**'
      - 'templates/**'
      - 'AGENTS.md'
      - 'manager-instructions.md'
      - 'chatgpt-custom-instructions.md'
      - 'universal-custom-instructions.md'
      - 'universal-custom-instructions-short.md'
      - 'gemini-ai-workshop-instructions.md'
      - '.github/copilot-instructions.md'
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'SETUP_GUIDE.md'
      - 'USER_MANUAL.md'
      - 'CHANGELOG.md'
      - 'RELEASE_READINESS.md'
  push:
    paths:
      - '.github/workflows/build-linux-installer.yml'
      - 'installer/linux/**'
      - 'Install AI Workshop.sh'
      - 'workshop.sh'
      - 'create-agents.sh'
      - 'workshop.py'
      - 'workshop_app.py'
      - 'desktop_setup.py'
      - 'desktop/**'
      - 'tests/**'
      - 'Open AI Workshop.sh'
      - 'ui/**'
      - 'Modelfile*'
      - 'agents/**'
      - 'guides/**'
      - 'templates/**'
      - 'AGENTS.md'
      - 'manager-instructions.md'
      - 'chatgpt-custom-instructions.md'
      - 'universal-custom-instructions.md'
      - 'universal-custom-instructions-short.md'
      - 'gemini-ai-workshop-instructions.md'
      - '.github/copilot-instructions.md'
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'SETUP_GUIDE.md'
      - 'USER_MANUAL.md'
      - 'CHANGELOG.md'
      - 'RELEASE_READINESS.md'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax
        run: bash -n 'Install AI Workshop.sh' 'Open AI Workshop.sh' workshop.sh create-agents.sh
      - name: Check app behavior
        run: python3 -m unittest discover -s tests -v
      - name: Build installer
        run: python3 installer/linux/build.py
      - name: Verify installer payload
        run: ./dist/linux/AI-Workshop-Linux-Setup.run --verify-only
      - name: Hash installer
        run: sha256sum dist/linux/AI-Workshop-Linux-Setup.run
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ai-workshop-linux-installer
          path: dist/linux/AI-Workshop-Linux-Setup.run
          if-no-files-found: error
